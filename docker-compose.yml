name: workflowops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflowops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflowops}
      POSTGRES_DB: ${POSTGRES_DB:-workflowops}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflowops}"]
      interval: 3s
      retries: 20

  mock-business-systems:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    command: uvicorn mock_business_systems.app:app --host 0.0.0.0 --port 8100
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      WFO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflowops}:${POSTGRES_PASSWORD:-workflowops}@postgres:5432/${POSTGRES_DB:-workflowops}
      WFO_MOCK_SYSTEMS_URL: http://mock-business-systems:8100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mock-business-systems: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

  # Observability skeleton (wired up in Phase 6).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/monitoring/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
