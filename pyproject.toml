[project]
name = "workflowops"
version = "0.1.0"
description = "Multi-framework, human-supervised AI operations platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "google-adk==2.15.0",
    "google-genai==2.34.0",
    "httpx==0.28.1",
    "langgraph==1.2.24",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.9",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "faker==40.63.0",
    "hypothesis==6.170.17",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
    "types-pyyaml==6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mock_business_systems"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "backend/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend", "mock_business_systems"]
exclude = ["backend/database/migrations/"]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: tests that spin up multiple in-process services",
]
